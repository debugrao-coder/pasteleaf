[package]
name = "pasteleaf-windows"
version = "0.2.0"
edition = "2021"
description = "Native Direct2D Windows client for PasteLeaf v2"
license = "MIT"

[dependencies]
pasteleaf-core = { path = "../../crates/pasteleaf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
 "Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Input_Ime",
 "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_Security"
] }
