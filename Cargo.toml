[workspace]
members = [".", "crates/pasteleaf-core", "clients/windows"]
default-members = ["crates/pasteleaf-core"]
resolver = "2"

[package]
name = "pasteleaf"
version = "0.1.0"
edition = "2021"
description = "Native Windows clipboard history with collections"
license = "MIT"
readme = "README.md"
repository = "https://github.com/debugrao-coder/pasteleaf"
keywords = ["clipboard", "windows", "desktop", "collections"]
categories = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
