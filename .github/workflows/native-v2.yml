name: Native v2 engineering validation
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'codex/macos-v2']
    tags: ['v0.2.*']
permissions:
  contents: read
concurrency:
  group: native-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      PASTELEAF_DISABLE_SYNC_WORKER: '1'
      PASTELEAF_DISABLE_KEYCHAIN: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Design and packaging regressions
        run: |
          python scripts/generate_design_tokens.py --check
          python -m unittest discover -s scripts -p "test_design_tokens.py" -v
          python -m unittest discover -s scripts -p "test_package*.py" -v
          python -m unittest discover -s scripts -p "test_macos_signing.py" -v
      - name: Locked dependencies
        run: cargo fetch --locked
      - name: Rust format
        run: cargo fmt --all --check
      - name: Shared core lint
        run: cargo clippy -p pasteleaf-core --locked --all-targets -- -D warnings
      - name: Shared core regressions
        run: cargo test -p pasteleaf-core --locked --release --all-targets -- --test-threads=1
      - name: Native library
        run: cargo build -p pasteleaf-core --locked --release
      - name: macOS FFI / native build
        if: runner.os == 'macOS'
        run: |
          python scripts/test_v2_abi.py -v
          bash clients/macos/test.sh
          bash clients/macos/test_sync_connection.sh
          bash clients/macos/build.sh
          python scripts/package_v2.py --platform macos --artifact dist/PasteLeaf.app
      - name: Windows native build and pure model tests
        if: runner.os == 'Windows'
        run: |
          cargo clippy -p pasteleaf-windows --locked --all-targets -- -D warnings
          cargo test -p pasteleaf-windows --locked --release
          cargo build -p pasteleaf-windows --locked --release
          python scripts/package_v2.py --platform windows --artifact target/release/pasteleaf-windows.exe
      - name: Windows ABI
        if: runner.os == 'Windows'
        env:
          PASTELEAF_CORE_LIBRARY: target/release/pasteleaf_core.dll
        run: python scripts/test_v2_abi.py -v
      - name: Upload engineering artifacts (not real-cloud acceptance)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pasteleaf-v2-${{ runner.os }}
          path: |
            dist/*preview.zip
            dist/*preview.zip.sha256
          if-no-files-found: error
