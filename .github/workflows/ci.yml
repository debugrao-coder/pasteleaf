name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Prepare the locked dependency cache for offline packaging
        run: cargo fetch --locked

      - name: Check Clippy
        run: cargo clippy -p pasteleaf --locked --all-targets -- -D warnings

      - name: Run all tests serially
        run: cargo test -p pasteleaf --locked --release --all-targets -- --test-threads=1

      - name: Build release executable
        run: cargo build -p pasteleaf --locked --release --bin pasteleaf

      - name: Test package integrity checks
        run: python -m unittest discover -s scripts -p test_package.py -v

      - name: Package and verify licenses and hashes
        run: python scripts/package.py

      - name: Upload the portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pasteleaf-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
